# 2-minute smoke-test config — tiny model, tiny data, runs on CPU or GPU.
# Use to verify the pipeline (data -> model -> train -> checkpoint -> resume) before touching Tier A.

# --- model dims ---
n_layer: 2
n_head: 2
n_embd: 64
block_size: 64
vocab_size: 50257
dropout: 0.0

# --- data ---
dataset_name: "HuggingFaceFW/fineweb-edu"
dataset_subset: "sample-10BT"
total_tokens: 2_000_000
val_tokens: 100_000
shard_tokens: 1_000_000

# --- training ---
micro_batch: 8
tokens_per_step: 512
learning_rate: 1.0e-3
min_lr_frac: 0.1
warmup_frac: 0.1
weight_decay: 0.1
grad_clip: 1.0
betas: [0.9, 0.95]

# --- schedule / budget ---
eval_interval: 10
eval_iters: 5
checkpoint_interval: 10
max_hours: 11.0

# --- misc ---
compile: false
seed: 1337
